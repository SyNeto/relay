[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relay"
version = "1.0.0-alpha"
description = "Harness-neutral find -> fix -> validate quality loop engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[project.scripts]
relay = "relay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
relay = ["prompts/*.md", "skills/*/*.md", "providers/*.json"]
